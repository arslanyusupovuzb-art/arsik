name: Verify storefront
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify catalog and order logic
        run: npm test
      - name: Build production storefront
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile interactions
        run: npm run test:e2e
      - name: Upload production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arsik-production-build
          path: dist/
          retention-days: 30
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
